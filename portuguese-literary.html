<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Corner | Português | Become a Literature Expert</title>

  <!--
    Google Analytics 4 for Reading Corner
    Replace G-W2T7NTPHXZ with your real Measurement ID if needed.
  -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W2T7NTPHXZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-W2T7NTPHXZ', {
      page_title: 'Portuguese Become a Literature Expert',
      page_path: '/reading-corner/portuguese-literary.html'
    });
  </script>

  <style>
    :root {
      --cream: #f6f1e8;
      --soft-cream: #fcf8f2;
      --terracotta: #9c3b34;
      --terracotta-dark: #7e2f2a;
      --olive: #556b2f;
      --olive-dark: #3f5221;
      --text: #211f1d;
      --muted: #6e655d;
      --white: #ffffff;
      --border: #eadfce;
      --shadow: 0 18px 44px rgba(60, 35, 20, 0.16);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        linear-gradient(rgba(246, 241, 232, 0.86), rgba(246, 241, 232, 0.92)),
        url('cover.png.png') center center / cover fixed no-repeat;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      background: var(--terracotta);
      color: white;
      text-align: center;
      padding: 46px 20px 34px;
      box-shadow: 0 4px 16px rgba(60, 35, 20, 0.18);
    }

    .topline {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 16px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 50px;
      line-height: 1.1;
      font-weight: 800;
    }

    .subtitle {
      margin: 18px 0 0;
      font-size: 22px;
      font-weight: 400;
    }

    main {
      width: min(980px, calc(100% - 34px));
      margin: 40px auto 56px;
    }

    .quiz-card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 34px 38px 42px;
    }

    .quiz-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 16px;
      font-weight: bold;
    }

    .progress-wrap {
      width: 100%;
      height: 14px;
      background: #efe4d6;
      border: 1px solid #dfd1c0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 34px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--olive), var(--terracotta));
      transition: width 0.25s ease;
    }

    .tag {
      display: inline-block;
      background: #fff4e4;
      color: var(--terracotta-dark);
      border: 1px solid #f0d8ba;
      border-radius: 999px;
      padding: 8px 15px;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .question {
      font-size: 30px;
      line-height: 1.35;
      margin: 0 0 26px;
      font-weight: 800;
    }

    .answers {
      display: grid;
      gap: 14px;
    }

    .answer {
      border: 1px solid #ead9c4;
      background: #fffdf9;
      border-radius: 16px;
      min-height: 58px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      transition: background 0.18s ease, border 0.18s ease, transform 0.18s ease;
    }

    .answer:hover:not(:disabled) {
      background: #fff7ec;
      transform: translateY(-1px);
    }

    .answer:disabled {
      cursor: default;
    }

    .answer.correct {
      background: #edf6e7;
      border-color: #7ba65a;
      color: #304b20;
    }

    .answer.wrong {
      background: #fdecea;
      border-color: #bc6a64;
      color: #7e2f2a;
    }

    .feedback {
      margin-top: 18px;
      padding: 15px 17px;
      border-radius: 14px;
      font-weight: bold;
      display: none;
    }

    .feedback.good {
      display: block;
      background: #edf6e7;
      color: #304b20;
      border: 1px solid #b8d6a5;
    }

    .feedback.bad {
      display: block;
      background: #fdecea;
      color: #7e2f2a;
      border: 1px solid #e1b1ad;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .nav-button {
      border: none;
      border-radius: 14px;
      padding: 14px 22px;
      min-width: 150px;
      color: white;
      background: var(--terracotta);
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(60, 35, 20, 0.14);
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .nav-button:hover {
      background: var(--terracotta-dark);
      transform: translateY(-1px);
    }

    .nav-button.secondary {
      background: var(--olive);
    }

    .nav-button.secondary:hover {
      background: var(--olive-dark);
    }

    .nav-button:disabled {
      background: #cfc1b2;
      cursor: default;
      transform: none;
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: 10px 0 4px;
    }

    .result-screen h2 {
      font-size: 38px;
      margin: 0 0 14px;
      color: var(--terracotta-dark);
    }

    .result-score {
      font-size: 24px;
      font-weight: bold;
      margin: 0 0 10px;
    }

    .result-message {
      color: var(--muted);
      font-size: 18px;
      max-width: 660px;
      margin: 0 auto 26px;
    }

    .small-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--terracotta-dark);
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: var(--muted);
      margin: 40px 0 24px;
      font-size: 15px;
    }

    @media (max-width: 760px) {
      .topbar {
        padding: 36px 16px 28px;
      }

      h1 {
        font-size: 38px;
      }

      .subtitle {
        font-size: 18px;
      }

      main {
        width: min(100% - 24px, 980px);
        margin-top: 24px;
      }

      .quiz-card {
        padding: 24px 20px 30px;
      }

      .question {
        font-size: 24px;
      }

      .answer {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topline">Reading Corner · Português</div>
    <h1>Become a Literature Expert</h1>
    <p class="subtitle">Mistério na Rua das Tulipas — quiz literário</p>
  </header>

  <main>
    <section class="quiz-card" id="quizCard">
      <div class="quiz-head">
        <div id="questionCounter">Pergunta 1 de 20</div>
        <div id="scoreBox">Pontos: 0</div>
      </div>
      <div class="progress-wrap" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="tag" id="questionTag">Começo da história</div>
      <h2 class="question" id="questionText"></h2>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>

      <div class="controls">
        <button class="nav-button secondary" id="homeButton" onclick="window.location.href='index.html'">Voltar à página inicial</button>
        <button class="nav-button" id="nextButton" disabled>Próxima pergunta</button>
      </div>
    </section>

    <section class="quiz-card result-screen" id="resultScreen">
      <h2>Resultado</h2>
      <p class="result-score" id="finalScore"></p>
      <p class="result-message" id="finalMessage"></p>
      <button class="nav-button" onclick="restartQuiz()">Tentar novamente</button>
      <br>
      <a class="small-link" href="index.html">Voltar à página inicial</a>
    </section>
  </main>

  <footer>© 2026 Reading Corner — Stories to go</footer>

  <script>
    const questions = [
      {
        tag: "Narrador",
        question: "Que tipo de narrador conta a maior parte da história?",
        answers: [
          "Um narrador em terceira pessoa que acompanha Giacomo de perto.",
          "O próprio senhor Cassi, depois da morte.",
          "Simona, em forma de diário.",
          "A senhorita Valle, em uma entrevista para a televisão."
        ],
        correct: 0
      },
      {
        tag: "Começo",
        question: "Por que o começo com a noite de primavera é importante para a atmosfera da história?",
        answers: [
          "Porque mostra que todos os personagens estão na praia.",
          "Porque cria uma situação comum antes de aparecer o mistério.",
          "Porque explica imediatamente quem é o assassino.",
          "Porque transforma a história em conto de fadas."
        ],
        correct: 1
      },
      {
        tag: "Suspense",
        question: "Qual detalhe cria suspense no fim da primeira parte?",
        answers: [
          "Giacomo joga futebol muito bem.",
          "Simona compra café para a mãe.",
          "A porta do senhor Cassi está aberta e não há barulho.",
          "O pai de Giacomo fala sobre bicicletas."
        ],
        correct: 2
      },
      {
        tag: "Personagens",
        question: "Como Giacomo é apresentado no início da história?",
        answers: [
          "Como um policial experiente.",
          "Como um homem rico e famoso.",
          "Como uma pessoa fria e sem emoções.",
          "Como um rapaz tímido, especialmente diante de Simona."
        ],
        correct: 3
      },
      {
        tag: "Diálogo",
        question: "Para que servem muitos diálogos na história?",
        answers: [
          "Para esconder totalmente a ação principal.",
          "Para mostrar informações, suspeitas e relações entre os personagens.",
          "Para trocar a história por uma aula de gramática.",
          "Para evitar que o leitor conheça Simona."
        ],
        correct: 1
      },
      {
        tag: "Pistas",
        question: "Qual é uma pista importante que o leitor deve guardar?",
        answers: [
          "A senhorita Valle quer aparecer na televisão.",
          "Giacomo sonha com futebol.",
          "A arma do crime ainda não foi encontrada.",
          "O elevador é antigo."
        ],
        correct: 2
      },
      {
        tag: "Falso suspeito",
        question: "Qual personagem funciona como falso suspeito durante boa parte da história?",
        answers: [
          "O senhor Moreno.",
          "Federico.",
          "A mãe de Giacomo.",
          "O cachorro Bebi."
        ],
        correct: 0
      },
      {
        tag: "Contraste",
        question: "Que contraste torna a senhora Bianchi mais interessante como personagem?",
        answers: [
          "Ela parece sempre triste, mas conta piadas.",
          "Ela parece gentil e elegante, mas esconde algo perigoso.",
          "Ela parece muito pobre, mas é médica.",
          "Ela parece criança, mas é avó."
        ],
        correct: 1
      },
      {
        tag: "Simona",
        question: "Qual é o papel de Simona na investigação?",
        answers: [
          "Ela só atrapalha Giacomo o tempo todo.",
          "Ela sabe desde o início quem matou Cassi.",
          "Ela acompanha Giacomo, pensa com ele e depois ajuda a salvá-lo.",
          "Ela trabalha oficialmente para a polícia."
        ],
        correct: 2
      },
      {
        tag: "Humor",
        question: "De onde vem parte do humor da história?",
        answers: [
          "Da guerra entre duas cidades.",
          "Das longas descrições científicas.",
          "De poemas escritos pelo senhor Cassi.",
          "Da timidez de Giacomo e da senhorita Valle, que fala demais."
        ],
        correct: 3
      },
      {
        tag: "Espaço",
        question: "Por que o prédio é um bom espaço para uma história de mistério?",
        answers: [
          "Porque vários personagens vivem perto uns dos outros e todos podem saber algo.",
          "Porque não há portas nem apartamentos.",
          "Porque ninguém conhece ninguém.",
          "Porque todos os personagens saem da cidade no começo."
        ],
        correct: 0
      },
      {
        tag: "Ritmo",
        question: "Como o ritmo da história muda no sábado à noite?",
        answers: [
          "Fica mais lento e sem nenhum perigo.",
          "Fica mais tenso, porque Giacomo vigia o jardim e corre perigo.",
          "Vira uma história de viagem ao mar.",
          "Passa a ser narrado apenas por Federico."
        ],
        correct: 1
      },
      {
        tag: "Reviravolta",
        question: "Qual é a grande reviravolta perto do final?",
        answers: [
          "Cassi não morreu de verdade.",
          "Simona decide sair da cidade.",
          "A senhora Bianchi revela que ela matou Cassi.",
          "O doutor Martino vira jornalista."
        ],
        correct: 2
      },
      {
        tag: "Ironia",
        question: "Por que a pergunta da senhora Bianchi sobre a estatueta é irônica?",
        answers: [
          "Porque Giacomo tinha pedido uma estatueta de presente.",
          "Porque a estatueta era de Simona.",
          "Porque a senhora Bianchi odeia arte.",
          "Porque ela revela saber mais do que deveria saber."
        ],
        correct: 3
      },
      {
        tag: "Tensão",
        question: "Qual objeto aumenta muito a tensão na cena final com a senhora Bianchi?",
        answers: [
          "A bicicleta de Giacomo.",
          "A pistola com silenciador.",
          "O pacote de açúcar.",
          "O telefone da polícia."
        ],
        correct: 1
      },
      {
        tag: "Campainha",
        question: "Qual é a função da campainha na cena final?",
        answers: [
          "Ela distrai a senhora Bianchi e dá a Giacomo uma chance de agir.",
          "Ela anuncia que o jantar está pronto.",
          "Ela mostra que o elevador voltou a funcionar.",
          "Ela prova que Moreno é inocente desde o começo."
        ],
        correct: 0
      },
      {
        tag: "Epilogo",
        question: "Para que serve o epílogo?",
        answers: [
          "Para começar outra investigação sem explicar nada.",
          "Para apagar todos os acontecimentos anteriores.",
          "Para mostrar o que mudou depois do crime e o que continuou igual.",
          "Para transformar Giacomo em professor."
        ],
        correct: 2
      },
      {
        tag: "Tema",
        question: "Qual tema aparece fortemente na história?",
        answers: [
          "A vida em outro planeta.",
          "A importância de observar detalhes e fazer perguntas.",
          "A história antiga de Roma.",
          "A construção de um estádio."
        ],
        correct: 1
      },
      {
        tag: "Gênero",
        question: "A que gênero a história pertence principalmente?",
        answers: [
          "Ficção científica.",
          "Poesia lírica.",
          "Manual de cozinha.",
          "Mistério / narrativa policial simples."
        ],
        correct: 3
      },
      {
        tag: "Leitor",
        question: "Por que a história faz perguntas diretas ao leitor em alguns momentos?",
        answers: [
          "Para fazer o leitor participar, imaginar hipóteses e pensar como detetive.",
          "Para mudar de idioma no meio da história.",
          "Para mostrar que não existe solução para o crime.",
          "Para impedir que o leitor entenda a história."
        ],
        correct: 0
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionCounter = document.getElementById('questionCounter');
    const scoreBox = document.getElementById('scoreBox');
    const progressBar = document.getElementById('progressBar');
    const questionTag = document.getElementById('questionTag');
    const questionText = document.getElementById('questionText');
    const answersBox = document.getElementById('answers');
    const feedback = document.getElementById('feedback');
    const nextButton = document.getElementById('nextButton');
    const quizCard = document.getElementById('quizCard');
    const resultScreen = document.getElementById('resultScreen');
    const finalScore = document.getElementById('finalScore');
    const finalMessage = document.getElementById('finalMessage');

    function renderQuestion() {
      answered = false;
      nextButton.disabled = true;
      feedback.className = 'feedback';
      feedback.textContent = '';

      const item = questions[currentQuestion];
      questionCounter.textContent = `Pergunta ${currentQuestion + 1} de ${questions.length}`;
      scoreBox.textContent = `Pontos: ${score}`;
      progressBar.style.width = `${(currentQuestion / questions.length) * 100}%`;
      questionTag.textContent = item.tag;
      questionText.textContent = item.question;
      answersBox.innerHTML = '';

      item.answers.forEach((answer, index) => {
        const button = document.createElement('button');
        button.className = 'answer';
        button.textContent = answer;
        button.onclick = () => chooseAnswer(index, button);
        answersBox.appendChild(button);
      });

      nextButton.textContent = currentQuestion === questions.length - 1 ? 'Ver resultado' : 'Próxima pergunta';
    }

    function chooseAnswer(index, selectedButton) {
      if (answered) return;
      answered = true;

      const item = questions[currentQuestion];
      const buttons = answersBox.querySelectorAll('.answer');

      buttons.forEach((button, buttonIndex) => {
        button.disabled = true;
        if (buttonIndex === item.correct) {
          button.classList.add('correct');
        }
      });

      if (index === item.correct) {
        score++;
        scoreBox.textContent = `Pontos: ${score}`;
        feedback.textContent = 'Certo! Muito bem.';
        feedback.className = 'feedback good';
      } else {
        selectedButton.classList.add('wrong');
        feedback.textContent = `Ainda não. A resposta correta é: ${item.answers[item.correct]}`;
        feedback.className = 'feedback bad';
      }

      nextButton.disabled = false;
    }

    nextButton.addEventListener('click', () => {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
      } else {
        showResult();
      }
    });

    function showResult() {
      progressBar.style.width = '100%';
      quizCard.style.display = 'none';
      resultScreen.style.display = 'block';
      finalScore.textContent = `Você fez ${score} de ${questions.length} pontos.`;

      if (score >= 18) {
        finalMessage.textContent = 'Excelente! Você entendeu muito bem a história e os detalhes principais.';
      } else if (score >= 14) {
        finalMessage.textContent = 'Muito bom! Você entendeu a história. Vale a pena reler algumas partes para perceber melhor as pistas.';
      } else if (score >= 10) {
        finalMessage.textContent = 'Bom começo. Você entendeu a ideia geral, mas algumas pistas importantes ficaram difíceis.';
      } else {
        finalMessage.textContent = 'Continue com calma. Leia a história mais uma vez e tente novamente.';
      }

      if (typeof gtag === 'function') {
        gtag('event', 'quiz_finished', {
          language: 'Portuguese',
          quiz_type: 'Literature',
          score: score,
          total: questions.length
        });
      }
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      quizCard.style.display = 'block';
      resultScreen.style.display = 'none';
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
